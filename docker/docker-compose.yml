name: eddies

services:
  build:
    image: eddies-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - gradle-cache:/opt/gradle-home
    command: bash docker/run-gradle.sh :app:assembleFullDebug

  build-release:
    image: eddies-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - gradle-cache:/opt/gradle-home
    command: bash docker/run-gradle.sh :app:assembleFullRelease

  test:
    image: eddies-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - gradle-cache:/opt/gradle-home
    command: bash docker/run-gradle.sh :app:testFullDebugUnitTest

  lint:
    image: eddies-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - gradle-cache:/opt/gradle-home
    command: bash docker/run-gradle.sh :app:lintFullDebug

  shell:
    image: eddies-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - gradle-cache:/opt/gradle-home
    entrypoint: ["bash"]

volumes:
  gradle-cache:

  demo:
    image: eddies-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - gradle-cache:/opt/gradle-home
    command: bash docker/run-gradle.sh :app:assembleDemoDebug
