name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep these in lockstep with docker/Dockerfile. A CI run against different
      # tooling than `make test` is not testing the thing that ships. The runner
      # image ships its own SDK at /usr/local/lib/android/sdk; we ignore it for
      # exactly that reason.
      CMDLINE_TOOLS_VERSION: "11076708"
      ANDROID_PLATFORM: android-36
      BUILD_TOOLS_VERSION: "36.0.0"
      GRADLE_VERSION: "8.13"
      ANDROID_HOME: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      # CI builds natively, so nothing here would otherwise ever parse the
      # compose file that is the actual developer entry point. A demo service
      # once landed under the volumes key and shipped: the build was green and
      # every `make` target was broken.
      - name: Validate the build container definition
        run: |
          docker compose -f docker/docker-compose.yml config -q
          services=$(docker compose -f docker/docker-compose.yml config --services)
          for target in build build-release test lint shell demo; do
            echo "$services" | grep -qx "$target" \
              || { echo "compose has no '$target' service, but the Makefile invokes it"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SDK + Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk
            /opt/gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}

      - name: Install Android SDK + Gradle
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            sudo mkdir -p "$ANDROID_HOME/cmdline-tools" && sudo chown -R "$USER" "$ANDROID_HOME"
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS_VERSION}"
          fi
          if [ ! -d "/opt/gradle/gradle-${GRADLE_VERSION}" ]; then
            sudo mkdir -p /opt/gradle && sudo chown -R "$USER" /opt/gradle
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
          fi
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: gradle --no-daemon :app:testFullDebugUnitTest

      - name: Lint
        run: gradle --no-daemon :app:lintFullDebug

      - name: Debug APK
        run: gradle --no-daemon :app:assembleFullDebug

      # The demo flavour shares all app code, so a change that breaks it breaks
      # the screenshots without anyone noticing until release time.
      - name: Demo flavour still builds
        run: gradle --no-daemon :app:assembleDemoDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
