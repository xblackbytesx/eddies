name: Build release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# gh release create needs this. Gitea's token is broadly scoped and needs no
# equivalent block, which is why the sibling projects have none to copy.
permissions:
  contents: write

jobs:
  build:
    # Stable tags only, skip pre-releases like v1.2.0-beta.1 unless dispatched.
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    env:
      # Keep these in lockstep with docker/Dockerfile.
      CMDLINE_TOOLS_VERSION: "11076708"
      ANDROID_PLATFORM: android-36
      BUILD_TOOLS_VERSION: "36.0.0"
      GRADLE_VERSION: "8.13"
      ANDROID_HOME: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SDK + Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk
            /opt/gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}

      - name: Install Android SDK + Gradle
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            sudo mkdir -p "$ANDROID_HOME/cmdline-tools" && sudo chown -R "$USER" "$ANDROID_HOME"
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS_VERSION}"
          fi
          if [ ! -d "/opt/gradle/gradle-${GRADLE_VERSION}" ]; then
            sudo mkdir -p /opt/gradle && sudo chown -R "$USER" /opt/gradle
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
          fi
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The release gate. A tag that fails the suite must not produce an APK.
      - name: Unit tests
        run: gradle --no-daemon :app:testFullDebugUnitTest

      - name: Materialize release keystore
        id: signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release
        env:
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.enabled == 'true' && '/tmp/release.jks' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Explicitly the full flavour. A release must never publish a demo
          # APK: it carries a fabricated portfolio and would look like real data.
          gradle --no-daemon :app:assembleFullRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Collect artifacts
        run: |
          # ABI splits produce one APK per architecture plus a universal one,
          # named app-<abi>-release[-unsigned].apk. All are attached: most people
          # want arm64-v8a, and universal is there for anyone unsure which to pick.
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          for apk in app/build/outputs/apk/full/release/*.apk; do
            [ -f "$apk" ] || continue
            name=$(basename "$apk" .apk)
            name=${name#app-}
            name=${name%-unsigned}
            name=${name%-release}
            if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
              cp "$apk" "dist/eddies-$TAG-$name.apk"
            else
              cp "$apk" "dist/eddies-$TAG-$name-unsigned.apk"
            fi
          done
          cp LICENSE dist/LICENSE
          ls -la dist/

      - name: Remove keystore
        if: always()
        run: rm -f /tmp/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: eddies-apk
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
