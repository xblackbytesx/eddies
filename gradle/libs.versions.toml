[versions]
# Build / language. Matched to the sibling Android projects (AGP 9, built-in
# Kotlin), so one container recipe and one set of gotchas covers all of them.
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
coroutines = "1.11.0"
serialization = "1.11.0"

# Compose
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Overrides the BOM for material3 only. HorizontalFloatingToolbar is the whole
# reason: the BOM still maps material3 to 1.4, which ships the toolbar's design
# tokens and not the composable. Drop this line once a BOM carries 1.5.0 stable.
material3 = "1.5.0-rc01"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"

# DI
hilt = "2.60.1"
hiltAndroidX = "1.4.0"

# Persistence
room = "2.8.5"
datastore = "1.2.1"
# Check the arm64 LOAD segments stay 0x4000 aligned when bumping
# (`readelf -lW libsqlcipher.so`): Android 15 requires 16 KB pages.
sqlcipher = "4.20.0"
# The version Room itself is built against. Only here for the migration API.
sqlite = "2.6.2"

# Networking
ktor = "3.6.0"

# Image loading
coil = "3.6.3"

# Crypto / security
tink = "1.23.0"
biometric = "1.1.0"
fragment = "1.9.1"

# Background work
work = "2.12.0"

# Testing
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Compose artifacts intentionally carry no version: the BOM governs them. The one
# exception is material3, pinned above for HorizontalFloatingToolbar.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# Carries hiltViewModel. It lived in hilt-navigation-compose until androidx.hilt
# 1.3.0 moved it here and deprecated the old copy. That artifact is dropped
# rather than kept alongside, because the no-arg hiltViewModel was the only thing
# used from it and two sources for one symbol is how the deprecated import
# creeps back.
hilt-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltAndroidX" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltAndroidX" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltAndroidX" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# BiometricPrompt requires a FragmentActivity, so MainActivity extends one and
# this is a direct dependency rather than a transitive accident.
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
